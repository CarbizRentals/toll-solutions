<svg xmlns="http://www.w3.org/2000/svg" width="560" height="360" viewBox="0 0 560 360" role="img" aria-labelledby="title desc">
  <title id="title">Spiral order of a 3 by 4 matrix</title>
  <desc id="desc">Cells 1, 2, 3, 4, 8, 12, 11, 10, 9, 5, 6, then 7, visited clockwise from the top left.</desc>
  <defs>
    <marker id="head" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#222"/>
    </marker>
  </defs>
  <rect x="0.5" y="0.5" width="559" height="359" fill="#fff" stroke="#222" stroke-width="1"/>
  <path d="M140 0 V360 M280 0 V360 M420 0 V360 M0 120 H560 M0 240 H560" stroke="#222" stroke-width="1.5"/>
  <g font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="700" fill="#111">
    <text x="36" y="72">1</text>
    <text x="176" y="72">2</text>
    <text x="316" y="72">3</text>
    <text x="476" y="58">4</text>
    <text x="36" y="192">5</text>
    <text x="176" y="192">6</text>
    <text x="336" y="192" text-anchor="middle">7</text>
    <text x="490" y="178" text-anchor="middle">8</text>
    <text x="70" y="318" text-anchor="middle">9</text>
    <text x="210" y="312">10</text>
    <text x="350" y="312">11</text>
    <text x="490" y="312">12</text>
  </g>
  <g fill="none" stroke="#222" stroke-width="2.2" marker-end="url(#head)">
    <path d="M62 60 H118"/>
    <path d="M202 60 H258"/>
    <path d="M342 60 H398"/>
    <path d="M490 78 V108"/>
    <path d="M62 180 H118"/>
    <path d="M202 180 H258"/>
    <path d="M490 198 V228"/>
    <path d="M70 292 V262"/>
    <path d="M200 300 H162"/>
    <path d="M340 300 H302"/>
    <path d="M480 300 H442"/>
  </g>
</svg>
