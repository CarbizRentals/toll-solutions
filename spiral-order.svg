<svg xmlns="http://www.w3.org/2000/svg" width="360" height="360" viewBox="0 0 360 360" role="img" aria-labelledby="title desc">
  <title id="title">Spiral order of a 3 by 3 matrix</title>
  <desc id="desc">Cells 1, 2, 3, 6, 9, 8, 7, 4, then 5, visited clockwise from the top left.</desc>
  <defs>
    <marker id="head" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#222"/>
    </marker>
  </defs>
  <rect x="0.5" y="0.5" width="359" height="359" fill="#fff" stroke="#222" stroke-width="1"/>
  <path d="M120 0 V360 M240 0 V360 M0 120 H360 M0 240 H360" stroke="#222" stroke-width="1.5"/>
  <g font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="700" fill="#111">
    <text x="36" y="72">1</text>
    <text x="156" y="72">2</text>
    <text x="276" y="58">3</text>
    <text x="36" y="192">4</text>
    <text x="176" y="192" text-anchor="middle">5</text>
    <text x="296" y="178" text-anchor="middle">6</text>
    <text x="56" y="318" text-anchor="middle">7</text>
    <text x="196" y="312">8</text>
    <text x="316" y="312">9</text>
  </g>
  <g fill="none" stroke="#222" stroke-width="2.2" marker-end="url(#head)">
    <path d="M62 60 H102"/>
    <path d="M182 60 H222"/>
    <path d="M300 78 V108"/>
    <path d="M62 180 H102"/>
    <path d="M300 198 V228"/>
    <path d="M56 292 V262"/>
    <path d="M188 300 H158"/>
    <path d="M308 300 H278"/>
  </g>
</svg>
